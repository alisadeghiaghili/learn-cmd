<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="learn-cmd">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B3A4A"/>
      <stop offset="55%" stop-color="#1E2732"/>
      <stop offset="100%" stop-color="#151B23"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0.15" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#60CDFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#60CDFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="16" y="16" width="224" height="224" rx="52" ry="52"/>
    </clipPath>
  </defs>

  <rect x="16" y="16" width="224" height="224" rx="52" ry="52" fill="url(#shell)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" ry="52" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <g clip-path="url(#clip)">
    <ellipse cx="128" cy="168" rx="120" ry="78" fill="url(#glow)"/>
  </g>

  <!-- Prompt: high-contrast, survives 16px -->
  <text x="40" y="172"
        font-family="Cascadia Code, Consolas, Courier New, monospace"
        font-size="72"
        font-weight="700"
        letter-spacing="-2"
        fill="#FFFFFF">C:\</text>

  <!-- Caret as a solid bar — legible at favicon size -->
  <rect x="188" y="118" width="22" height="62" rx="4" fill="#60CDFF"/>
</svg>
